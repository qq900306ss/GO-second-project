services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"
    networks:
      - myapp-network
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./views:/app/views  # 掛載本地 views 目錄

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 900306
      MYSQL_DATABASE: secondproject
    ports:
      - "3306:3306"
    networks:
      - myapp-network
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - myapp-network
    volumes:
      - redis-data:/data

networks:
  myapp-network:

volumes:
  mysql-data:
  redis-data: